# Not yet run. Check the first run.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - run: make test
      - run: make sample

  base-change:
    name: base changes are visible
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Removed or weakened rules, version bump, changelog
        run: python3 tools/check_base_change.py --base origin/${{ github.base_ref }}
