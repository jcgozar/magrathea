# SETUP-006. Written by Magrathea and not yet run. Check the first run.
# Runs the "Quick start" commands of each app's local-setup README (app/api/README.md,
# app/web/README.md). Apps without a README are skipped with a notice; the reviewer raises
# that under SETUP-001/SETUP-004.
#
# Limits:
# - All sh/bash code blocks under "## Quick start" are joined, in order, into ONE bash script run
#   with `set -euo pipefail` from the app directory, so cd, export, source and backslash
#   continuations work.
# - No foreground servers: a command that never exits runs until timeout-minutes and fails the
#   job. Background it (command &) or leave it out of the Quick start.
# - Commands needing secrets, a local .env or a container runtime may fail here; that is a gap in
#   the README. TODO: confirm Docker/Testcontainers behaviour on the runner.
name: local-setup

on:
  pull_request:
    paths:
      - "app/README.md"
      - "app/*/README.md"
      - "app/*/package.json"
      - "app/*/package-lock.json"
      - "app/*/pom.xml"
      - "app/*/Dockerfile"
      - ".github/workflows/local-setup.yml"
  push:
    paths:
      - "app/README.md"
      - "app/*/README.md"
      - "app/*/package.json"
      - "app/*/package-lock.json"
      - "app/*/pom.xml"
      - "app/*/Dockerfile"
      - ".github/workflows/local-setup.yml"

permissions:
  contents: read

jobs:
  quick-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.app == 'api'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        if: matrix.app == 'web'
        with:
          node-version: "22"
      - name: Run the README quick start
        run: |
          python3 - "app/${{ matrix.app }}/README.md" "app/${{ matrix.app }}" <<'PY'
          import re, subprocess, sys
          path, cwd = sys.argv[1], sys.argv[2]
          try:
              text = open(path, encoding="utf-8").read()
          except FileNotFoundError:
              print("::notice::%s not found; skipping (SETUP-001)" % path)
              sys.exit(0)
          m = re.search(r"^## Quick start\s*$(.*?)(?=^## |\Z)", text, re.S | re.M)
          if not m:
              print("::error::%s has no '## Quick start' section" % path)
              sys.exit(1)
          blocks = re.findall(r"```(?:sh|bash)\n(.*?)```", m.group(1), re.S)
          if not blocks:
              print("::error::no sh code block under Quick start in %s" % path)
              sys.exit(1)
          script = "set -euo pipefail\n" + "\n".join(blocks)
          print(script, flush=True)
          subprocess.run(["bash", "-c", script], check=True, cwd=cwd)
          PY
