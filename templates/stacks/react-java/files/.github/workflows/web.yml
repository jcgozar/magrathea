# Written by Magrathea and not yet run. Check the first run.
name: web

on:
  push:
    paths: ["app/web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["app/web/**", ".github/workflows/web.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: npm test --if-present
