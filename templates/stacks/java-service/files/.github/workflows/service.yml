# Written by Magrathea and not yet run. Check the first run.
# Test on every change under app/. Build the image on pull requests. Push it to ghcr.io on the
# default branch, tagged with the git sha (pinned tag, never latest: K8S-006).
name: service

on:
  push:
    paths: ["app/**", ".github/workflows/service.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/service.yml"]

permissions:
  contents: read

env:
  IMAGE_NAME: @@slug@@

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B verify

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          docker build -t "ghcr.io/${owner}/${IMAGE_NAME}:${GITHUB_SHA}" app
      - name: Push the image (default branch only)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE"
